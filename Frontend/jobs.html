<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listings | CampusHire</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <div class="sidebar-logo">CampusHire</div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="sidebar-link">
                    <span class="icon">🏠</span> Dashboard
                </a>
                <a href="jobs.html" class="sidebar-link active">
                    <span class="icon">💼</span> Job Listings
                </a>
                <a href="profile.html" class="sidebar-link">
                    <span class="icon">👤</span> My Profile
                </a>
                <a href="resume.html" class="sidebar-link">
                    <span class="icon">📄</span> Resume
                </a>
                <a href="chatbot.html" class="sidebar-link">
                    <span class="icon">🤖</span> AI Assistant
                </a>
            </nav>
            <a href="#" id="logoutBtn" class="sidebar-link logout-link">
                <span class="icon">🚪</span> Logout
            </a>
        </aside>

        <main class="main-content">

            <div class="content-header">
                <div>
                    <h1>Job Listings</h1>
                    <p class="subtitle">Browse and apply to open positions.</p>
                </div>
            </div>

            <!-- ============ FILTER BAR ============ -->
            <section class="dashboard-card">
                <div class="filter-bar">
                    <input type="text" id="searchInput" class="filter-input" placeholder="Search by title or company...">
                    <select id="branchFilter" class="filter-select">
                        <option value="">All Branches</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="ME">ME</option>
                        <option value="IT">IT</option>
                    </select>
                </div>
            </section>

            <!-- ============ MESSAGE AREA (for apply success/error) ============ -->
            <p id="applyMessage" style="font-weight: 600; margin: 10px 0;"></p>

            <!-- ============ JOBS GRID ============ -->
            <div class="jobs-grid" id="jobsGrid">
                <!-- Job cards injected by JS -->
            </div>

        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/jobs.js"></script>
</body>
</html>

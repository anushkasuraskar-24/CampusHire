<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard | CampusHire</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/recruiter.css">
</head>
<body>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <div class="sidebar-logo">CampusHire</div>
            <nav class="sidebar-nav">
                <a href="recruiter-dashboard.html" class="sidebar-link active">
                    <span class="icon">🏠</span> Dashboard
                </a>
            </nav>
            <a href="#" id="logoutBtn" class="sidebar-link logout-link">
                <span class="icon">🚪</span> Logout
            </a>
        </aside>

        <main class="main-content">

            <div class="content-header">
                <div>
                    <h1 id="companyNameHeader">Recruiter Dashboard</h1>
                    <p class="subtitle">Manage your job postings and applicants.</p>
                </div>
            </div>

            <!-- ============ STATS ROW ============ -->
            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-value" id="statTotalJobs">0</span>
                    <span class="stat-label">Active Jobs</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="statTotalApplicants">0</span>
                    <span class="stat-label">Total Applicants</span>
                </div>
            </div>

            <!-- ============ POST A NEW JOB ============ -->
            <section class="dashboard-card">
                <h2>Post a New Job</h2>
                <p id="postJobMessage" style="font-weight: 600;"></p>

                <form id="postJobForm" class="form-grid">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" id="jobTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Role Type</label>
                        <select id="jobRoleType" required>
                            <option value="fulltime">Full-time</option>
                            <option value="internship">Internship</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="jobDescription" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Salary Min (LPA)</label>
                        <input type="number" id="jobSalaryMin" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Salary Max (LPA)</label>
                        <input type="number" id="jobSalaryMax" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Minimum CGPA</label>
                        <input type="number" id="jobMinCgpa" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Eligible Branches (comma-separated)</label>
                        <input type="text" id="jobEligibleBranches" placeholder="CSE,ECE,IT" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Required Skills (comma-separated)</label>
                        <input type="text" id="jobRequiredSkills" placeholder="C++,SQL,Python">
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="btn btn-primary">Post Job</button>
                    </div>
                </form>
            </section>

            <!-- ============ MY POSTINGS ============ -->
            <section class="dashboard-card">
                <h2>My Job Postings</h2>
                <div id="myPostingsList">
                    <!-- Postings injected by JS -->
                </div>
            </section>

            <!-- ============ APPLICANTS FOR SELECTED JOB ============ -->
            <section class="dashboard-card" id="applicantsSection" style="display: none;">
                <h2>Applicants for: <span id="selectedJobTitle"></span></h2>
                <table class="applications-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Branch</th>
                            <th>CGPA</th>
                            <th>Status</th>
                            <th>Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="applicantsTableBody">
                        <!-- Applicants injected by JS -->
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/recruiter-dashboard.js"></script>
</body>
</html>

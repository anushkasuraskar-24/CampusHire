<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusHire</title>

    <!-- Same shared stylesheet — reuses .auth-section/.auth-card from login.html -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============ NAVIGATION BAR (same as other pages) ============ -->
    <header class="navbar">
        <div class="logo">CampusHire</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <!-- ============ REGISTER FORM SECTION ============ -->
    <section class="auth-section">
        <div class="auth-card">
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Join CampusHire to get started</p>

            <!-- 
                Just like login.html, this form isn't connected to the 
                backend yet. We'll wire it up with register.js once the 
                backend API exists to actually save new users.
            -->
            <form id="registerForm">

                <!-- Full Name -->
                <label for="fullName">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    placeholder="Enter your full name" 
                    required
                >

                <!-- Role Selector -->
                <label for="role">I am a</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="student">Student</option>
                    <option value="recruiter">Recruiter</option>
                    <option value="admin">Admin</option>
                </select>

                <!-- 
                    Branch field — mainly relevant for Students.
                    For now it's a plain visible field for everyone.
                    Later, register.js can hide this automatically 
                    when role != student.
                -->
                <label for="branch">Branch / Department</label>
                <select id="branch" name="branch">
                    <option value="" disabled selected>Select your branch</option>
                    <option value="cse">Computer Science</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="me">Mechanical Engineering</option>
                    <option value="ce">Civil Engineering</option>
                    <option value="other">Other</option>
                </select>

                <!-- Email -->
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com" 
                    required
                >

                <!-- Password -->
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Create a password" 
                    required
                >

                <!-- Confirm Password -->
                <label for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Re-enter your password" 
                    required
                >

                <button type="submit" class="btn btn-primary auth-btn">Register</button>

                <!-- Placeholder for validation errors (e.g. "Passwords don't match") -->
                <p id="registerError" class="error-message"></p>

            </form>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </section>

    <!-- ============ FOOTER (same as other pages) ============ -->
    <footer class="footer">
        <p>&copy; 2026 CampusHire. Built as an academic placement management project.</p>
    </footer>

    <!-- Doesn't exist yet — we'll build this when we wire up the backend -->
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>

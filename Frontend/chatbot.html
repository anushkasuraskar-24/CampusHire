<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | CampusHire</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <div class="sidebar-logo">CampusHire</div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html" class="sidebar-link">
                    <span class="icon">🏠</span> Dashboard
                </a>
                <a href="jobs.html" class="sidebar-link">
                    <span class="icon">💼</span> Job Listings
                </a>
                <a href="profile.html" class="sidebar-link">
                    <span class="icon">👤</span> My Profile
                </a>
                <a href="resume.html" class="sidebar-link">
                    <span class="icon">📄</span> Resume
                </a>
                <a href="chatbot.html" class="sidebar-link active">
                    <span class="icon">🤖</span> AI Assistant
                </a>
            </nav>
            <a href="#" id="logoutBtn" class="sidebar-link logout-link">
                <span class="icon">🚪</span> Logout
            </a>
        </aside>

        <main class="main-content chat-page">

            <div class="content-header">
                <div>
                    <h1>🤖 AI Career Assistant</h1>
                    <p class="subtitle">Ask about companies hiring for your skills.</p>
                </div>
            </div>

            <div class="chat-window" id="chatWindow">
                <div class="message bot-message">
                    <div class="message-bubble">
                        Hi! Tell me your skills (e.g. "I know C++, SQL and Python") and I'll suggest companies and roles for you.
                    </div>
                </div>
            </div>

            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Type your message...">
                <button id="sendBtn" class="btn btn-primary">Send</button>
            </div>

            <div class="suggestion-chips">
                <button class="suggestion-chip" data-msg="I know C++, SQL and Python">C++, SQL, Python</button>
                <button class="suggestion-chip" data-msg="I know JavaScript and React">JavaScript, React</button>
                <button class="suggestion-chip" data-msg="I know Java and DBMS">Java, DBMS</button>
            </div>

        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
